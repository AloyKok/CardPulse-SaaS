<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardPulse | Maintenance</title>
    <meta
      name="description"
      content="CardPulse storefront is under maintenance while we prepare the next version."
    />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef3f7;
        color: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 28rem),
          linear-gradient(180deg, #f8fafc 0%, #eef3f7 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 720px);
        overflow: hidden;
        border: 1px solid #d7dee8;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      .hero {
        display: grid;
        gap: 24px;
        padding: clamp(28px, 6vw, 56px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #0f766e;
      }

      .mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 14px;
        background: #0f172a;
        color: #ffffff;
        font-size: 17px;
        letter-spacing: 0;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(42px, 10vw, 76px);
        line-height: 0.96;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 58ch;
        margin: 0;
        color: #475569;
        font-size: 17px;
        font-weight: 650;
        line-height: 1.7;
      }

      .status {
        display: grid;
        gap: 10px;
        border-top: 1px solid #d7dee8;
        background: #f8fafc;
        padding: 18px clamp(28px, 6vw, 56px);
      }

      .row {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .label {
        color: #64748b;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .value {
        color: #0f172a;
        font-size: 14px;
        font-weight: 900;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: #0f172a;
        padding: 0 18px;
        color: #ffffff;
        font-size: 14px;
        font-weight: 900;
        text-decoration: none;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      @media (max-width: 520px) {
        main {
          padding: 14px;
        }

        .panel {
          border-radius: 22px;
        }

        .actions,
        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="maintenance-title">
        <div class="hero">
          <div class="brand">
            <span class="mark">CP</span>
            CardPulse
          </div>
          <h1 id="maintenance-title">Storefront under maintenance.</h1>
          <p>
            We are preparing the public CardPulse storefront. The vendor admin system is still available for authorized users.
          </p>
          <div class="actions">
            <a href="/admin">Open admin</a>
          </div>
        </div>
        <div class="status">
          <div class="row">
            <span class="label">Status</span>
            <span class="value">Maintenance mode</span>
          </div>
          <div class="row">
            <span class="label">Admin system</span>
            <span class="value">Available at /admin</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
